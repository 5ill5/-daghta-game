<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="ضغطة — لعبة توقيت عربية سريعة، كل ما تحتاجه ضغطة واحدة.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ضغطة">
  <link rel="manifest" href="./manifest.webmanifest?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="./daghta-icon-192-v3.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./daghta-touch-v3.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="./daghta-touch-v3.png">
  <title>ضغطة — لعبة من زر واحد</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7fbff;
      --muted: #8da0b6;
      --panel: rgba(13, 28, 47, .78);
      --line: rgba(255, 255, 255, .11);
      --lime: #baff37;
      --cyan: #28d7f5;
      --coral: #ff6b6b;
      --orbit: min(67vw, 41vh, 330px);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: "SF Arabic", "Noto Sans Arabic", Tahoma, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 12%, rgba(40, 215, 245, .16), transparent 27rem),
        radial-gradient(circle at 86% 92%, rgba(186, 255, 55, .11), transparent 25rem),
        #07111f;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .34;
      background-image:
        linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(circle at center, black, transparent 80%);
    }

    .shell {
      min-height: 100svh;
      width: min(100%, 720px);
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      direction: rtl;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1.08rem;
      letter-spacing: -.02em;
    }

    .brand-mark {
      width: 27px;
      aspect-ratio: 1;
      border: 2px solid var(--lime);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 18px rgba(186,255,55,.28);
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      width: 7px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--lime);
      left: 50%;
      top: -4px;
      transform: translateX(-50%);
    }

    .stats { display: flex; gap: 8px; }

    .stat {
      min-width: 75px;
      padding: 8px 12px 7px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.035);
      text-align: center;
    }

    .stat small {
      display: block;
      color: var(--muted);
      font-size: .73rem;
      margin-bottom: 1px;
    }

    .stat strong {
      display: block;
      font-size: 1.15rem;
      font-variant-numeric: tabular-nums;
    }

    .game {
      position: relative;
      isolation: isolate;
      align-self: center;
      min-height: min(620px, calc(100svh - 164px));
      border: 1px solid var(--line);
      border-radius: 34px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.055), transparent 38%),
        var(--panel);
      box-shadow: 0 28px 80px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      padding: 26px 18px;
      cursor: pointer;
      touch-action: manipulation;
      outline: none;
    }

    .game:focus-visible {
      box-shadow: 0 0 0 3px #07111f, 0 0 0 6px var(--cyan), 0 28px 80px rgba(0,0,0,.35);
    }

    .game::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      opacity: 0;
      background: radial-gradient(circle at center, rgba(186,255,55,.22), transparent 65%);
      transition: opacity .16s ease;
    }

    .game.success::after { opacity: 1; }
    .game.miss::after { background: radial-gradient(circle at center, rgba(255,107,107,.24), transparent 65%); opacity: 1; }

    .status {
      text-align: center;
      min-height: 65px;
      display: grid;
      place-content: center;
    }

    .eyebrow {
      color: var(--cyan);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .12em;
      margin-bottom: 5px;
    }

    .message {
      margin: 0;
      font-size: clamp(1.45rem, 5vw, 2.15rem);
      line-height: 1.25;
      letter-spacing: -.04em;
    }

    .orbit-wrap {
      width: var(--orbit);
      aspect-ratio: 1;
      position: relative;
      display: grid;
      place-items: center;
    }

    .orbit-base,
    .target-arc {
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .orbit-base {
      border: clamp(9px, 2.6vw, 14px) solid rgba(255,255,255,.07);
      box-shadow: inset 0 0 35px rgba(0,0,0,.28), 0 0 45px rgba(40,215,245,.07);
    }

    .target-arc {
      background: conic-gradient(from var(--target-start), var(--lime) 0deg var(--target-width), transparent var(--target-width) 360deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 15px), #000 calc(100% - 14px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 15px), #000 calc(100% - 14px));
      filter: drop-shadow(0 0 10px rgba(186,255,55,.72));
      transition: filter .14s ease;
    }

    .game.success .target-arc { filter: drop-shadow(0 0 20px rgba(186,255,55,1)); }

    .rotor {
      position: absolute;
      inset: 0;
      transform: rotate(var(--angle));
      will-change: transform;
    }

    .orb {
      position: absolute;
      width: 24px;
      aspect-ratio: 1;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #fff;
      border: 5px solid var(--cyan);
      box-shadow: 0 0 0 5px rgba(40,215,245,.12), 0 0 28px rgba(40,215,245,.9);
    }

    .center {
      width: 54%;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-content: center;
      text-align: center;
      background: radial-gradient(circle at 34% 27%, rgba(255,255,255,.1), rgba(8,18,32,.95) 68%);
      border: 1px solid rgba(255,255,255,.09);
      box-shadow: 0 18px 45px rgba(0,0,0,.32);
    }

    .score {
      display: block;
      font-size: clamp(3rem, 13vw, 5rem);
      font-weight: 950;
      line-height: .92;
      letter-spacing: -.06em;
      font-variant-numeric: tabular-nums;
    }

    .score-label {
      color: var(--muted);
      font-size: .78rem;
      margin-top: 9px;
    }

    .prompt {
      width: min(90%, 390px);
      min-height: 58px;
      padding: 12px 20px;
      display: grid;
      place-content: center;
      border-radius: 18px;
      background: var(--lime);
      color: #102000;
      font-size: 1rem;
      font-weight: 900;
      box-shadow: 0 10px 28px rgba(186,255,55,.17);
      transition: transform .12s ease, background .12s ease;
    }

    .game:active .prompt { transform: scale(.97); }
    .game[data-state="playing"] .prompt { background: rgba(255,255,255,.07); color: var(--ink); box-shadow: none; }
    .game[data-state="over"] .prompt { background: var(--coral); color: #2b0808; box-shadow: 0 10px 28px rgba(255,107,107,.2); }

    .hint {
      text-align: center;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.5;
    }

    .key {
      display: inline-block;
      min-width: 28px;
      padding: 2px 7px;
      color: #cbd7e5;
      border: 1px solid rgba(255,255,255,.16);
      border-bottom-width: 3px;
      border-radius: 7px;
      background: rgba(255,255,255,.05);
      font-size: .72rem;
    }

    .footer {
      text-align: center;
      color: #71839a;
      font-size: .75rem;
    }

    @media (max-height: 690px) {
      :root { --orbit: min(58vw, 37vh, 270px); }
      .game { gap: 16px; min-height: calc(100svh - 150px); padding-block: 18px; }
      .status { min-height: 52px; }
      .prompt { min-height: 50px; }
      .footer { font-size: .7rem; }
    }

    @media (max-width: 430px) {
      .shell { padding-inline: 12px; }
      .game { border-radius: 27px; }
      .stat { min-width: 65px; padding-inline: 9px; }
      .stat:first-child { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .game::after, .prompt { transition: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>ضغطة</span></div>
      <div class="stats" aria-label="إحصاءات الجولة">
        <div class="stat"><small>السرعة</small><strong id="speedText">1.0×</strong></div>
        <div class="stat"><small>الأفضل</small><strong id="bestText">0</strong></div>
      </div>
    </header>

    <main class="game" id="game" role="button" tabindex="0" aria-describedby="hint" aria-label="ابدأ لعبة ضغطة" data-state="ready">
      <section class="status" aria-live="polite">
        <div class="eyebrow" id="eyebrow">ركّز على المنطقة الخضراء</div>
        <h1 class="message" id="message">ضغطة في اللحظة المناسبة</h1>
      </section>

      <div class="orbit-wrap" id="orbit" aria-hidden="true">
        <div class="orbit-base"></div>
        <div class="target-arc"></div>
        <div class="rotor"><div class="orb"></div></div>
        <div class="center">
          <strong class="score" id="scoreText">0</strong>
          <span class="score-label">نقطة</span>
        </div>
      </div>

      <div class="prompt" id="prompt">اضغط للبدء</div>
      <div class="hint" id="hint">المس أي مكان داخل البطاقة أو استخدم <span class="key">Space</span></div>
    </main>

    <footer class="footer">عبدالله التركي</footer>
  </div>

  <script>
    (() => {
      const game = document.getElementById('game');
      const orbit = document.getElementById('orbit');
      const scoreText = document.getElementById('scoreText');
      const bestText = document.getElementById('bestText');
      const speedText = document.getElementById('speedText');
      const message = document.getElementById('message');
      const eyebrow = document.getElementById('eyebrow');
      const prompt = document.getElementById('prompt');

      const safeBest = Number.parseInt(localStorage.getItem('daghta-best') || '0', 10);
      let best = Number.isFinite(safeBest) ? safeBest : 0;
      let state = 'ready';
      let score = 0;
      let angle = 206;
      let target = 22;
      let targetWidth = 48;
      let direction = 1;
      let speed = 86;
      let lastFrame = performance.now();
      let acceptingTap = true;
      let audioContext;

      bestText.textContent = best;
      paint();

      function angularDistance(a, b) {
        return Math.abs(((a - b + 540) % 360) - 180);
      }

      function paint() {
        orbit.style.setProperty('--angle', `${angle}deg`);
        orbit.style.setProperty('--target-start', `${target - targetWidth / 2}deg`);
        orbit.style.setProperty('--target-width', `${targetWidth}deg`);
      }

      function nextTarget() {
        let candidate;
        do candidate = Math.random() * 360;
        while (angularDistance(candidate, angle) < 105);
        target = candidate;
        targetWidth = Math.max(19, 48 - score * 1.65);
        speed = Math.min(226, 86 + score * 8.5);
        if (score > 0 && score % 4 === 0) direction *= -1;
        speedText.textContent = `${(speed / 86).toFixed(1)}×`;
        acceptingTap = true;
        paint();
      }

      function sound(kind) {
        try {
          audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = kind === 'miss' ? 'sawtooth' : 'sine';
          osc.frequency.setValueAtTime(kind === 'miss' ? 145 : 540 + score * 18, audioContext.currentTime);
          if (kind !== 'miss') osc.frequency.exponentialRampToValueAtTime(820 + score * 18, audioContext.currentTime + .09);
          gain.gain.setValueAtTime(.055, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + .12);
          osc.connect(gain).connect(audioContext.destination);
          osc.start();
          osc.stop(audioContext.currentTime + .13);
        } catch (_) {}
      }

      function setState(next) {
        state = next;
        game.dataset.state = next;
        game.setAttribute('aria-label', next === 'playing' ? 'اضغط عندما تدخل النقطة المنطقة الخضراء' : next === 'over' ? 'انتهت الجولة، اضغط للمحاولة من جديد' : 'ابدأ لعبة ضغطة');
      }

      function start() {
        score = 0;
        angle = 206;
        direction = 1;
        scoreText.textContent = '0';
        message.textContent = 'التقط النقطة الآن';
        eyebrow.textContent = 'داخل الأخضر = نقطة';
        prompt.textContent = 'اضغط داخل المنطقة الخضراء';
        setState('playing');
        nextTarget();
        sound('start');
      }

      function tap() {
        if (state !== 'playing') {
          start();
          return;
        }
        if (!acceptingTap) return;
        acceptingTap = false;
        const distance = angularDistance(angle, target);
        const hit = distance <= targetWidth / 2 + 6;

        if (hit) {
          score += 1;
          scoreText.textContent = score;
          if (score > best) {
            best = score;
            bestText.textContent = best;
            localStorage.setItem('daghta-best', String(best));
          }
          const perfect = distance <= Math.max(4, targetWidth * .14);
          message.textContent = perfect ? 'في الصميم!' : 'التقاط ممتاز';
          eyebrow.textContent = perfect ? 'توقيت مثالي' : `استمر — ${score}`;
          game.classList.add('success');
          sound('hit');
          navigator.vibrate?.(25);
          setTimeout(() => {
            game.classList.remove('success');
            message.textContent = 'مرة أخرى…';
            eyebrow.textContent = 'راقب الأخضر';
            nextTarget();
          }, 360);
        } else {
          setState('over');
          message.textContent = score === 0 ? 'قريبة! جرّب مجددًا' : `وصلت إلى ${score}`;
          eyebrow.textContent = score >= best && score > 0 ? 'أفضل نتيجة جديدة' : 'انتهت الجولة';
          prompt.textContent = 'اضغط للمحاولة من جديد';
          game.classList.add('miss');
          sound('miss');
          navigator.vibrate?.([45, 35, 45]);
          setTimeout(() => game.classList.remove('miss'), 260);
        }
      }

      function tick(now) {
        const delta = Math.min(34, now - lastFrame) / 1000;
        lastFrame = now;
        if (state === 'playing' && acceptingTap) {
          angle = (angle + speed * direction * delta + 360) % 360;
          orbit.style.setProperty('--angle', `${angle}deg`);
        }
        requestAnimationFrame(tick);
      }

      game.addEventListener('click', tap);
      window.addEventListener('keydown', (event) => {
        if (event.code === 'Space' || event.code === 'Enter') {
          if (event.repeat) return;
          event.preventDefault();
          tap();
        }
      });

      document.addEventListener('visibilitychange', () => { lastFrame = performance.now(); });
      requestAnimationFrame(tick);
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
